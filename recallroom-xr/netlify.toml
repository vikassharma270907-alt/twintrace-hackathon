[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Permissions-Policy = "xr-spatial-tracking=*, microphone=*"
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/"
  to = "/OPEN_ME.html"
  status = 200
