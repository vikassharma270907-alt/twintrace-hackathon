# ==============================================================================
# Render Blueprint Specification — RecallRoom XR
# Meta VR Start Developer Competition 2026
#
# Deploys:
#   1. recallroom-backend: FastAPI AI Microservice (Docker container)
#   2. recallroom-webxr:   Spatial WebXR Memory Palace Laboratory (Static CDN)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. AI Inference Backend (FastAPI + Whisper ASR + Sentence Transformers)
  # ----------------------------------------------------------------------------
  - type: web
    name: recallroom-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASR_MODEL
        value: tiny.en
      - key: SEMANTIC_MODEL
        value: all-MiniLM-L6-v2
      - key: THRESHOLD_CORRECT
        value: "0.75"
      - key: THRESHOLD_PARTIAL
        value: "0.50"
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: "8000"

  # ----------------------------------------------------------------------------
  # 2. WebXR Spatial Memory Palace Laboratory (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: recallroom-webxr
    runtime: static
    buildCommand: echo "WebXR static bundle ready"
    staticPublishPath: .
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Permissions-Policy
        value: "xr-spatial-tracking=*, microphone=*"
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
