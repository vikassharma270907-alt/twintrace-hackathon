# ── TwinTrace · Netlify deployment ────────────────────────
[build]
  command   = "cd twintrace/iwsdk && npm install && npm run build"
  publish   = "twintrace"

# Redirect root → main app
[[redirects]]
  from   = "/"
  to     = "/index.html"
  status = 200

# ── Global headers ────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options            = "nosniff"
    Referrer-Policy                   = "strict-origin-when-cross-origin"
    Permissions-Policy                = "xr-spatial-tracking=(self), camera=(), microphone=()"
    Strict-Transport-Security         = "max-age=63072000; includeSubDomains; preload"

# WebXR IWSDK bundle — COOP/COEP for SharedArrayBuffer (Quest)
[[headers]]
  for = "/iwsdk/dist/*"
  [headers.values]
    Cache-Control                     = "public, max-age=31536000, immutable"
    Cross-Origin-Opener-Policy        = "same-origin"
    Cross-Origin-Embedder-Policy      = "require-corp"

# Case fixtures
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control  = "public, max-age=3600"
    Content-Type   = "application/json"
